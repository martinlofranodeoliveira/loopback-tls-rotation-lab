name: local-tls-lab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install local tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends make openssl
      - name: Record tool versions
        run: |
          java -version
          javac -version
          openssl version
          make --version
      - name: Regression and adversarial checks
        run: make test
      - name: Independent asserting demo run
        run: make demo
